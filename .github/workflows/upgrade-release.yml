name: Upgrade and Release v1.2.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete mobile UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/attendance-app/src/main/java/com/streetbell/attendance/MainActivity.kt')
          s = p.read_text()
          start = s.index('    @Composable\n    private fun App(cameraEnabled: Boolean)')
          end = s.index('    private fun pair(', start)
          new_app = r'''    @Composable
    private fun App(cameraEnabled: Boolean) {
        var paired by remember { mutableStateOf(deviceToken != null) }
        var code by remember { mutableStateOf("") }
        var message by remember { mutableStateOf(if (paired) "Preparing camera…" else "Enter the pairing code from Admin") }
        var face by remember { mutableStateOf<Person?>(null) }
        var detected by remember { mutableStateOf(false) }
        var status by remember { mutableStateOf<String?>(null) }
        var score by remember { mutableStateOf(0f) }

        LaunchedEffect(paired) { if (paired) refreshManifest { message = it } }

        if (!paired) {
            Column(Modifier.fillMaxSize().padding(28.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                Text("ATTENDANCE", style = MaterialTheme.typography.headlineLarge)
                Text("Attendance terminal setup", style = MaterialTheme.typography.titleMedium)
                Spacer(Modifier.height(28.dp))
                Card(Modifier.fillMaxWidth()) {
                    Column(Modifier.padding(22.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                        Text("Pair this device", style = MaterialTheme.typography.titleLarge)
                        Spacer(Modifier.height(10.dp))
                        Text("Ask an administrator for the one-time pairing code.")
                        Spacer(Modifier.height(18.dp))
                        OutlinedTextField(code, { code = it.uppercase() }, label = { Text("Pairing code") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                        Spacer(Modifier.height(14.dp))
                        Button(onClick = { pair(code) { ok, msg -> message = msg; if (ok) paired = true } }, modifier = Modifier.fillMaxWidth()) { Text("CONNECT DEVICE") }
                        Spacer(Modifier.height(10.dp))
                        Text(message)
                    }
                }
            }
            return
        }

        Column(Modifier.fillMaxSize().padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally) {
            Text("Attendance", style = MaterialTheme.typography.headlineMedium)
            Text("Face scan terminal", style = MaterialTheme.typography.bodyMedium)
            Spacer(Modifier.height(10.dp))
            Card(Modifier.fillMaxWidth().weight(1f)) {
                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                    if (cameraEnabled) {
                        AndroidView(factory = { context -> PreviewView(context).also { view -> startCamera(view) { isDetected, person, matchScore -> detected = isDetected; face = person; score = matchScore } } }, modifier = Modifier.fillMaxSize())
                    } else Text("Camera permission required")
                }
            }
            Spacer(Modifier.height(12.dp))
            Card(Modifier.fillMaxWidth()) {
                Column(Modifier.padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                    Text(when { face != null -> "Welcome, ${face!!.name}"; detected -> "Face detected — employee not recognized"; else -> "Position your face inside the camera" }, style = MaterialTheme.typography.titleMedium)
                    if (face != null) Text("Match ${(score * 100).toInt()}% • Select attendance status")
                    Spacer(Modifier.height(12.dp))
                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                        Button(enabled = face != null && !busy, onClick = { val e = face ?: return@Button; submit("IN", e.id, score) { status = "IN"; message = it } }, modifier = Modifier.weight(1f)) { Text("IN") }
                        Button(enabled = face != null && !busy, onClick = { val e = face ?: return@Button; submit("OUT", e.id, score) { status = "OUT"; message = it } }, modifier = Modifier.weight(1f)) { Text("OUT") }
                    }
                    Spacer(Modifier.height(8.dp))
                    Text(status?.let { "Selected $it • $message" } ?: message)
                }
            }
        }
    }

'''
          p.write_text(s[:start] + new_app + s[end:])

          p = Path('android/admin-app/src/main/java/com/streetbell/admin/MainActivity.kt')
          s = p.read_text()
          start = s.index('    @Composable\n    private fun App()')
          end = s.index('    @Composable\n    private fun Dashboard', start)
          new_admin = r'''    @Composable
    private fun App() {
        var logged by remember { mutableStateOf(token != null) }
        var email by remember { mutableStateOf("") }
        var pass by remember { mutableStateOf("") }
        var message by remember { mutableStateOf("") }
        if (!logged) {
            Column(Modifier.fillMaxSize().padding(28.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                Card(Modifier.fillMaxWidth()) {
                    Column(Modifier.padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                        Text("ATTEND", style = MaterialTheme.typography.headlineLarge)
                        Text("Admin Console", style = MaterialTheme.typography.titleMedium)
                        Spacer(Modifier.height(24.dp))
                        OutlinedTextField(email, { email = it }, label = { Text("Email") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                        Spacer(Modifier.height(10.dp))
                        OutlinedTextField(pass, { pass = it }, label = { Text("Password") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                        Spacer(Modifier.height(16.dp))
                        Button(onClick = { login(email, pass) { ok, msg -> message = msg; if (ok) logged = true } }, modifier = Modifier.fillMaxWidth()) { Text("SIGN IN") }
                        if (message.isNotBlank()) Text(message, Modifier.padding(top = 10.dp))
                    }
                }
            }
        } else AdminHome()
    }

    @Composable
    private fun AdminHome() {
        var tab by remember { mutableStateOf("Dashboard") }
        var employees by remember { mutableStateOf(emptyList<Employee>()) }
        var devices by remember { mutableStateOf(emptyList<Device>()) }
        var events by remember { mutableStateOf(emptyList<Attendance>()) }
        var message by remember { mutableStateOf("Loading…") }
        LaunchedEffect(Unit) {
            loadEmployees { employees = it }
            loadDevices { devices = it }
            loadAttendance { events = it; message = "Live data loaded" }
        }
        Column(Modifier.fillMaxSize().padding(16.dp)) {
            Text("ATTEND", style = MaterialTheme.typography.headlineLarge)
            Text("Attendance management", style = MaterialTheme.typography.bodyMedium)
            Spacer(Modifier.height(12.dp))
            ScrollableTabRow(selectedTabIndex = listOf("Dashboard", "Employees", "Devices", "Attendance").indexOf(tab)) {
                listOf("Dashboard", "Employees", "Devices", "Attendance").forEach { item -> Tab(selected = tab == item, onClick = { tab = item }, text = { Text(item) }) }
            }
            Spacer(Modifier.height(14.dp))
            when (tab) {
                "Dashboard" -> Dashboard(employees, devices, events)
                "Employees" -> Employees(employees, message) { loadEmployees { employees = it } }
                "Devices" -> Devices(devices, message)
                "Attendance" -> AttendanceList(events, message) { loadAttendance { events = it } }
            }
        }
    }

'''
          p.write_text(s[:start] + new_admin + s[end:])

          # Version bump for the next installable release.
          for f in ['android/attendance-app/build.gradle.kts','android/admin-app/build.gradle.kts']:
              q = Path(f); t = q.read_text(); t = t.replace('versionCode 1', 'versionCode 2').replace('versionName = "1.0.0"', 'versionName = "1.2.0"'); q.write_text(t)
          PY
      - name: Commit upgraded application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android
          git diff --cached --quiet || git commit -m "Complete mobile UI and prepare v1.2.0"
          git push
