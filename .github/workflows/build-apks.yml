name: Build Attendance APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APKs
        run: gradle -p android :attendance-app:assembleDebug :admin-app:assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apks
          path: |
            android/attendance-app/build/outputs/apk/debug/*.apk
            android/admin-app/build/outputs/apk/debug/*.apk
