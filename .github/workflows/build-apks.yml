name: Build Attendance APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: gradle --no-daemon -p android :attendance-app:assembleDebug :attendance-app:assembleRelease :admin-app:assembleDebug :admin-app:assembleRelease

      - name: Verify APKs
        run: |
          test -s android/attendance-app/build/outputs/apk/debug/attendance-app-debug.apk
          test -s android/attendance-app/build/outputs/apk/release/attendance-app-release.apk
          test -s android/admin-app/build/outputs/apk/debug/admin-app-debug.apk
          test -s android/admin-app/build/outputs/apk/release/admin-app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apks-v1.2.0
          if-no-files-found: error
          path: |
            android/attendance-app/build/outputs/apk/debug/attendance-app-debug.apk
            android/attendance-app/build/outputs/apk/release/attendance-app-release.apk
            android/admin-app/build/outputs/apk/debug/admin-app-debug.apk
            android/admin-app/build/outputs/apk/release/admin-app-release.apk

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v1.2.0 --title "Attendance Platform v1.2.0" --generate-notes --repo "$GITHUB_REPOSITORY"
          gh release upload v1.2.0 \
            android/attendance-app/build/outputs/apk/release/attendance-app-release.apk#Employee-Attendance-v1.2.0.apk \
            android/admin-app/build/outputs/apk/release/admin-app-release.apk#Attendance-Admin-v1.2.0.apk \
            --clobber --repo "$GITHUB_REPOSITORY"
