name: Build Attendance APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure production backend URL
        run: |
          sed -i 's|http://10.0.2.2:8080|https://attendance-backend-rkny.onrender.com|g' android/attendance-app/src/main/java/com/streetbell/attendance/MainActivity.kt
          sed -i 's|http://10.0.2.2:8080|https://attendance-backend-rkny.onrender.com|g' android/admin-app/src/main/java/com/streetbell/admin/MainActivity.kt
      - name: Remove invalid Compose weight import
        run: sed -i '/import androidx.compose.foundation.layout.weight/d' android/attendance-app/src/main/java/com/streetbell/attendance/MainActivity.kt
      - name: Build APKs
        run: gradle --no-daemon -p android :attendance-app:assembleDebug :attendance-app:assembleRelease :admin-app:assembleDebug :admin-app:assembleRelease
      - name: Verify APK outputs
        run: |
          find android -type f -name '*.apk' -print
          test -f android/attendance-app/build/outputs/apk/debug/attendance-app-debug.apk
          test -f android/admin-app/build/outputs/apk/debug/admin-app-debug.apk
      - name: Upload APKs to Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apks-v1.1.0
          if-no-files-found: error
          path: |
            android/attendance-app/build/outputs/apk/debug/*.apk
            android/attendance-app/build/outputs/apk/release/*.apk
            android/admin-app/build/outputs/apk/debug/*.apk
            android/admin-app/build/outputs/apk/release/*.apk
      - name: Create v1.1.0 release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v1.1.0 --title "Attendance Platform v1.1.0" --generate-notes --repo "$GITHUB_REPOSITORY"
      - name: Publish installable debug APKs to v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.0 \
            android/attendance-app/build/outputs/apk/debug/attendance-app-debug.apk#Employee-Attendance-v1.1.0.apk \
            android/admin-app/build/outputs/apk/debug/admin-app-debug.apk#Attendance-Admin-v1.1.0.apk \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
