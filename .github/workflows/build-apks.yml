name: Build and Release v1.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android apps
        working-directory: android
        run: gradle --no-daemon :attendance-app:assembleRelease :admin-app:assembleRelease

      - name: Verify and stage APKs
        shell: bash
        run: |
          set -euo pipefail
          echo "APK files produced:"
          find android -type f -name '*.apk' -print -exec ls -lh {} \;
          attendance_apk="$(find android/attendance-app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          admin_apk="$(find android/admin-app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$attendance_apk"
          test -n "$admin_apk"
          test -s "$attendance_apk"
          test -s "$admin_apk"
          cp "$attendance_apk" Employee-Attendance-v1.2.apk
          cp "$admin_apk" Attendance-Admin-v1.2.apk
          ls -lh Employee-Attendance-v1.2.apk Attendance-Admin-v1.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apks-v1.2
          if-no-files-found: error
          path: |
            Employee-Attendance-v1.2.apk
            Attendance-Admin-v1.2.apk

      - name: Create or update v1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.2 --title "v1.2" --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.2 --target "$GITHUB_SHA" --title "v1.2" --notes "Attendance Android apps v1.2" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload v1.2 Employee-Attendance-v1.2.apk Attendance-Admin-v1.2.apk --clobber --repo "$GITHUB_REPOSITORY"
