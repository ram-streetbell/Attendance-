name: Build Attendance APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply production configuration and final UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_between(path, begin, end, replacement):
              p=Path(path); s=p.read_text(); a=s.index(begin); b=s.index(end,a); p.write_text(s[:a]+replacement+s[b:])
          att='android/attendance-app/src/main/java/com/streetbell/attendance/MainActivity.kt'
          s=Path(att).read_text().replace('http://10.0.2.2:8080','https://attendance-backend-rkny.onrender.com')
          start=s.index('    @Composable\n    private fun App(cameraEnabled: Boolean)'); end=s.index('    private fun pair(',start)
          ui='''    @Composable\n    private fun App(cameraEnabled: Boolean) {\n        var paired by remember { mutableStateOf(deviceToken != null) }\n        var code by remember { mutableStateOf("") }\n        var message by remember { mutableStateOf(if (paired) "Preparing camera…" else "Enter the pairing code from Admin") }\n        var face by remember { mutableStateOf<Person?>(null) }\n        var detected by remember { mutableStateOf(false) }\n        var status by remember { mutableStateOf<String?>(null) }\n        var score by remember { mutableStateOf(0f) }\n        LaunchedEffect(paired) { if (paired) refreshManifest { message = it } }\n        if (!paired) {\n            Column(Modifier.fillMaxSize().padding(28.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {\n                Text("ATTENDANCE", style = MaterialTheme.typography.headlineLarge)\n                Text("Attendance terminal setup", style = MaterialTheme.typography.titleMedium)\n                Spacer(Modifier.height(24.dp))\n                Card(Modifier.fillMaxWidth()) { Column(Modifier.padding(22.dp)) {\n                    Text("Pair this device", style = MaterialTheme.typography.titleLarge)\n                    Spacer(Modifier.height(10.dp)); Text("Use the one-time pairing code generated by Admin.")\n                    Spacer(Modifier.height(16.dp)); OutlinedTextField(code,{code=it.uppercase()},label={Text("Pairing code")},singleLine=true,modifier=Modifier.fillMaxWidth())\n                    Spacer(Modifier.height(12.dp)); Button(onClick={pair(code){ok,msg->message=msg;if(ok)paired=true}},modifier=Modifier.fillMaxWidth()){Text("CONNECT DEVICE")}\n                    Spacer(Modifier.height(8.dp)); Text(message)\n                }}\n            }; return\n        }\n        Column(Modifier.fillMaxSize().padding(16.dp),horizontalAlignment=Alignment.CenterHorizontally){\n            Text("Attendance",style=MaterialTheme.typography.headlineMedium); Text("Face scan terminal",style=MaterialTheme.typography.bodyMedium); Spacer(Modifier.height(10.dp))\n            Card(Modifier.fillMaxWidth().weight(1f)){ Box(Modifier.fillMaxSize(),contentAlignment=Alignment.Center){\n                if(cameraEnabled) AndroidView(factory={context->PreviewView(context).also{view->startCamera(view){isDetected,person,matchScore->detected=isDetected;face=person;score=matchScore}}},modifier=Modifier.fillMaxSize()) else Text("Camera permission required")\n            }}\n            Spacer(Modifier.height(10.dp)); Card(Modifier.fillMaxWidth()){Column(Modifier.padding(14.dp),horizontalAlignment=Alignment.CenterHorizontally){\n                Text(when{face!=null->"Welcome, ${face!!.name}";detected->"Face detected — employee not recognized";else->"Position your face inside the camera"},style=MaterialTheme.typography.titleMedium)\n                if(face!=null)Text("Match ${(score*100).toInt()}% • Choose IN or OUT")\n                Spacer(Modifier.height(10.dp)); Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(12.dp)){\n                    Button(enabled=face!=null&&!busy,onClick={val e=face?:return@Button;submit("IN",e.id,score){status="IN";message=it}},modifier=Modifier.weight(1f)){Text("IN")}\n                    Button(enabled=face!=null&&!busy,onClick={val e=face?:return@Button;submit("OUT",e.id,score){status="OUT";message=it}},modifier=Modifier.weight(1f)){Text("OUT")}\n                }; Spacer(Modifier.height(6.dp)); Text(status?.let{"Selected $it • $message"}?:message)\n            }}\n        }\n    }\n\n'''
          Path(att).write_text(s[:start]+ui+s[end:])
          adm='android/admin-app/src/main/java/com/streetbell/admin/MainActivity.kt'; s=Path(adm).read_text().replace('http://10.0.2.2:8080','https://attendance-backend-rkny.onrender.com')
          start=s.index('    @Composable\n    private fun App()'); end=s.index('    @Composable\n    private fun Dashboard',start)
          ui='''    @Composable\n    private fun App() {\n        var logged by remember { mutableStateOf(token != null) }; var email by remember { mutableStateOf("") }; var pass by remember { mutableStateOf("") }; var message by remember { mutableStateOf("") }\n        if(!logged) Column(Modifier.fillMaxSize().padding(28.dp),horizontalAlignment=Alignment.CenterHorizontally,verticalArrangement=Arrangement.Center){ Card(Modifier.fillMaxWidth()){Column(Modifier.padding(24.dp),horizontalAlignment=Alignment.CenterHorizontally){\n            Text("ATTEND",style=MaterialTheme.typography.headlineLarge); Text("Admin Console",style=MaterialTheme.typography.titleMedium); Spacer(Modifier.height(22.dp));\n            OutlinedTextField(email,{email=it},label={Text("Email")},singleLine=true,modifier=Modifier.fillMaxWidth()); Spacer(Modifier.height(10.dp)); OutlinedTextField(pass,{pass=it},label={Text("Password")},singleLine=true,modifier=Modifier.fillMaxWidth()); Spacer(Modifier.height(14.dp));\n            Button(onClick={login(email,pass){ok,msg->message=msg;if(ok)logged=true}},modifier=Modifier.fillMaxWidth()){Text("SIGN IN")}; if(message.isNotBlank())Text(message,Modifier.padding(top=8.dp))\n        }}} else AdminHome()\n    }\n\n    @Composable\n    private fun AdminHome(){\n        var tab by remember{mutableStateOf("Dashboard")}; var employees by remember{mutableStateOf(emptyList<Employee>())}; var devices by remember{mutableStateOf(emptyList<Device>())}; var events by remember{mutableStateOf(emptyList<Attendance>())}; var message by remember{mutableStateOf("Loading…")}\n        LaunchedEffect(Unit){loadEmployees{employees=it};loadDevices{devices=it};loadAttendance{events=it;message="Live data loaded"}}\n        Column(Modifier.fillMaxSize().padding(16.dp)){Text("ATTEND",style=MaterialTheme.typography.headlineLarge);Text("Attendance management",style=MaterialTheme.typography.bodyMedium);Spacer(Modifier.height(10.dp));\n            val tabs=listOf("Dashboard","Employees","Devices","Attendance"); ScrollableTabRow(selectedTabIndex=tabs.indexOf(tab)){tabs.forEach{item->Tab(selected=tab==item,onClick={tab=item},text={Text(item)})}};Spacer(Modifier.height(12.dp));\n            when(tab){"Dashboard"->Dashboard(employees,devices,events);"Employees"->Employees(employees,message){loadEmployees{employees=it}};"Devices"->Devices(devices,message);"Attendance"->AttendanceList(events,message){loadAttendance{events=it}}}\n        }\n    }\n\n'''
          Path(adm).write_text(s[:start]+ui+s[end:])
          for f in ['android/attendance-app/build.gradle.kts','android/admin-app/build.gradle.kts']:
              q=Path(f); t=q.read_text().replace('versionCode 1','versionCode 2').replace('versionName = "1.0.0"','versionName = "1.2.0"'); q.write_text(t)
          PY
      - name: Remove invalid import
        run: sed -i '/import androidx.compose.foundation.layout.weight/d' android/attendance-app/src/main/java/com/streetbell/attendance/MainActivity.kt
      - name: Build APKs
        run: gradle --no-daemon -p android :attendance-app:assembleDebug :attendance-app:assembleRelease :admin-app:assembleDebug :admin-app:assembleRelease
      - name: Verify APKs
        run: |
          test -f android/attendance-app/build/outputs/apk/debug/attendance-app-debug.apk
          test -f android/admin-app/build/outputs/apk/debug/admin-app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apks-v1.2.0
          if-no-files-found: error
          path: |
            android/attendance-app/build/outputs/apk/debug/*.apk
            android/admin-app/build/outputs/apk/debug/*.apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v1.2.0 --title "Attendance Platform v1.2.0" --generate-notes --repo "$GITHUB_REPOSITORY"
      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.2.0 android/attendance-app/build/outputs/apk/debug/attendance-app-debug.apk#Employee-Attendance-v1.2.0.apk android/admin-app/build/outputs/apk/debug/admin-app-debug.apk#Attendance-Admin-v1.2.0.apk --clobber --repo "$GITHUB_REPOSITORY"
