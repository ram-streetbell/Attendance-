name: Build and Release v1.6.4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download FaceNet model
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/shubham0204/FaceRecognition_With_FaceNet_Android/master/app/src/main/assets/facenet.tflite"
          for app in attendance-app admin-app; do
            mkdir -p "android/$app/src/main/assets"
            curl --fail --location --retry 3 --output "android/$app/src/main/assets/facenet.tflite" "$url"
            test "$(stat -c%s "android/$app/src/main/assets/facenet.tflite")" -gt 1000000
          done
      - name: Build Android APKs
        working-directory: android
        run: gradle --no-daemon --stacktrace --warning-mode all :attendance-app:assembleDebug :admin-app:assembleDebug
      - name: Verify and stage APKs
        shell: bash
        run: |
          set -euo pipefail
          attendance_apk="$(find android/attendance-app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          admin_apk="$(find android/admin-app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -s "$attendance_apk"
          test -s "$admin_apk"
          cp "$attendance_apk" Employee-Attendance-v1.6.4.apk
          cp "$admin_apk" Attendance-Admin-v1.6.4.apk
          ls -lh Employee-Attendance-v1.6.4.apk Attendance-Admin-v1.6.4.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apks-v1.6.4
          if-no-files-found: error
          path: |
            Employee-Attendance-v1.6.4.apk
            Attendance-Admin-v1.6.4.apk
      - name: Publish v1.6.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v1.6.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.6.4 --target "$GITHUB_SHA" --title "v1.6.4" --notes "Attendance persistence and photo upload reliability fix" --repo "$GITHUB_REPOSITORY"
          fi
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.6.4" --jq '.id')"
          for asset in Employee-Attendance-v1.6.4.apk Attendance-Admin-v1.6.4.apk; do
            asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq ".[] | select(.name == \"$asset\") | .id" | head -n 1 || true)"
            if [ -n "$asset_id" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; fi
          done
          gh release edit v1.6.4 --target "$GITHUB_SHA" --title "v1.6.4" --repo "$GITHUB_REPOSITORY"
          gh release upload v1.6.4 Employee-Attendance-v1.6.4.apk Attendance-Admin-v1.6.4.apk --repo "$GITHUB_REPOSITORY"
