name: Build Attendance APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        run: gradle --no-daemon -p android :attendance-app:assembleDebug :attendance-app:assembleRelease :admin-app:assembleDebug :admin-app:assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apks
          if-no-files-found: error
          path: |
            android/attendance-app/build/outputs/apk/debug/*.apk
            android/attendance-app/build/outputs/apk/release/*.apk
            android/admin-app/build/outputs/apk/debug/*.apk
            android/admin-app/build/outputs/apk/release/*.apk
