name: Build and Release v1.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android apps
        working-directory: android
        run: gradle --no-daemon :attendance-app:assembleRelease :admin-app:assembleRelease

      - name: Verify APKs
        run: |
          test -s android/attendance-app/build/outputs/apk/release/attendance-app-release.apk
          test -s android/admin-app/build/outputs/apk/release/admin-app-release.apk
          cp android/attendance-app/build/outputs/apk/release/attendance-app-release.apk Employee-Attendance-v1.2.apk
          cp android/admin-app/build/outputs/apk/release/admin-app-release.apk Attendance-Admin-v1.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apks-v1.2
          if-no-files-found: error
          path: |
            Employee-Attendance-v1.2.apk
            Attendance-Admin-v1.2.apk

      - name: Create or update v1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.2 --title "v1.2" --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.2 --target "$GITHUB_SHA" --title "v1.2" --notes "Attendance Android apps v1.2" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload v1.2 Employee-Attendance-v1.2.apk Attendance-Admin-v1.2.apk --clobber --repo "$GITHUB_REPOSITORY"
